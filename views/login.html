<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
}

body {
    height: 100vh;
    background: #020617;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #cbd5e1;
}

.login-container {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 10;
}

.login-box {
    padding: 45px 40px;
    background: #111827;
    border-radius: 24px;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
    animation: fadeIn 0.6s ease;
    position: relative;
    overflow: hidden;
}

.login-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at top right, rgba(168, 85, 247, 0.15) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
}

.login-form-container, .forgot-password-section {
    position: relative;
    z-index: 2;
}

.login-box h2 {
    text-align: center;
    color: #f8fafc;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
    font-size: 26px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group input {
    width: 100%;
    padding: 14px 18px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    outline: none;
    color: #f8fafc;
    font-size: 14px;
    transition: all 0.3s ease;
}

.input-group input::placeholder {
    color: #64748b;
}

.input-group input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(168, 85, 247, 0.4);
}

/* ===== FORGOT PASSWORD SECTION ===== */
.forgot-password-section {
    display: none;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.05);
}

.forgot-password-section.active {
    display: block;
}

.forgot-password-section h3 {
    color: #f8fafc;
    font-size: 18px;
    margin-bottom: 12px;
    text-align: center;
}

.forgot-password-section p {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 20px;
    text-align: center;
}

.forgot-password-section input {
    width: 100%;
    padding: 14px 18px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    outline: none;
    color: #f8fafc;
    font-size: 14px;
    transition: all 0.3s ease;
    margin-bottom: 15px;
}

.forgot-password-section input::placeholder {
    color: #64748b;
}

.forgot-password-section input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
}

/* ===== TOGGLE LINK ===== */
.toggle-link {
    text-align: center;
    margin-top: 20px;
}

.toggle-link a {
    color: #a855f7;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
    font-weight: 500;
}

.toggle-link a:hover {
    text-decoration: underline;
    color: #c084fc;
}

/* ===== MESSAGES ===== */
.message {
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 14px;
    display: none;
    font-weight: 500;
}

.message.error {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.2);
}

.message.success {
    background: rgba(16, 185, 129, 0.1);
    color: #10b981;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .login-box {
        padding: 35px 25px;
    }

    .login-box h2 {
        font-size: 24px;
        margin-bottom: 25px;
    }
}
</style>
</head>

<body>

<div class="login-container">
    <div class="login-box">
        <!-- ===== LOGIN FORM ===== -->
        <div id="loginForm" class="login-form-container">
            <h2>Admin Login</h2>
            <div class="message error" id="loginError"></div>
            <div class="message success" id="loginSuccess"></div>
            
            <form method="POST" action="/login" id="adminLoginForm">
                <div class="input-group">
                    <input type="email" name="admin_id" placeholder="Admin Email" required>
                </div>

                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <button type="submit">Login</button>
            </form>

            <div class="toggle-link">
                <a onclick="toggleForgotPassword()">Forgot Password?</a>
            </div>
        </div>

        <!-- ===== FORGOT PASSWORD FORM ===== -->
        <div id="forgotPasswordForm" class="forgot-password-section">
            <h3>Reset Password</h3>
            <p>Enter your email address and we'll send you a password reset link.</p>
            
            <div class="message error" id="resetError"></div>
            <div class="message success" id="resetSuccess"></div>
            
            <form id="resetPasswordForm">
                <div class="input-group">
                    <input type="email" id="resetEmail" placeholder="Enter your email" required>
                </div>

                <button type="submit">Send Reset Link</button>
            </form>

            <div class="toggle-link">
                <a onclick="toggleForgotPassword()">Back to Login</a>
            </div>
        </div>
    </div>
</div>

<script>
// ===== TOGGLE FORGOT PASSWORD FORM =====
function toggleForgotPassword() {
    const loginForm = document.getElementById('loginForm');
    const forgotForm = document.getElementById('forgotPasswordForm');
    
    loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
    forgotForm.classList.toggle('active');
    
    // Clear messages
    clearMessages();
}

// ===== CLEAR MESSAGES =====
function clearMessages() {
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('loginSuccess').style.display = 'none';
    document.getElementById('resetError').style.display = 'none';
    document.getElementById('resetSuccess').style.display = 'none';
}

// ===== HANDLE LOGIN ERROR FROM URL =====
const params = new URLSearchParams(window.location.search);
if (params.get("error")) {
    const loginError = document.getElementById('loginError');
    if (params.get("error") === "1") {
        loginError.textContent = "❌ Invalid email or password";
    } else if (params.get("error") === "invalid") {
        loginError.textContent = "❌ Please fill in all fields";
    } else {
        loginError.textContent = "❌ Login failed. Please try again.";
    }
    loginError.style.display = 'block';
}

// ===== HANDLE PASSWORD RESET FORM =====
document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('resetEmail').value;
    const resetError = document.getElementById('resetError');
    const resetSuccess = document.getElementById('resetSuccess');
    
    clearMessages();
    
    try {
        const response = await fetch('/api/reset-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            resetError.textContent = "❌ " + (data.error || 'Failed to send reset email');
            resetError.style.display = 'block';
            return;
        }
        
        resetSuccess.textContent = "✅ " + data.message;
        resetSuccess.style.display = 'block';
        document.getElementById('resetPasswordForm').reset();
        
    } catch (error) {
        console.error('Reset error:', error);
        resetError.textContent = "❌ Server error. Please try again later.";
        resetError.style.display = 'block';
    }
});
</script>

</body>
</html>
