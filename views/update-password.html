<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Password</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
}

body {
    height: 100vh;
    background: #020617;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #cbd5e1;
}

.login-container {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 10;
}

.login-box {
    padding: 45px 40px;
    background: #111827;
    border-radius: 24px;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
    animation: fadeIn 0.6s ease;
    position: relative;
    overflow: hidden;
}

.login-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at top right, rgba(168, 85, 247, 0.15) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
}

#updateFormContainer {
    position: relative;
    z-index: 2;
}

.login-box h2 {
    text-align: center;
    color: #f8fafc;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
    font-size: 26px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group input {
    width: 100%;
    padding: 14px 18px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    outline: none;
    color: #f8fafc;
    font-size: 14px;
    transition: all 0.3s ease;
}

.input-group input::placeholder {
    color: #64748b;
}

.input-group input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(168, 85, 247, 0.4);
}

.message {
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 14px;
    display: none;
    font-weight: 500;
}

.message.error {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.2);
}

.message.success {
    background: rgba(16, 185, 129, 0.1);
    color: #10b981;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

.toggle-link {
    text-align: center;
    margin-top: 20px;
}

.toggle-link a {
    color: #a855f7;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
    font-weight: 500;
}

.toggle-link a:hover {
    text-decoration: underline;
    color: #c084fc;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .login-box {
        padding: 35px 25px;
    }

    .login-box h2 {
        font-size: 24px;
        margin-bottom: 25px;
    }
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div id="updateFormContainer">
            <h2>Update Password</h2>
            
            <div class="message error" id="updateError" style="display: none;"></div>
            <div class="message success" id="updateSuccess" style="display: none;"></div>
            
            <!-- Supabase auth hash error -->
            <div class="message error" id="hashError" style="display: none;"></div>
            
            <form id="updatePasswordForm">
                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
                </div>
                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="6">
                </div>
                <button type="submit">Update Password</button>
            </form>

            <div class="toggle-link">
                <a href="/login">Back to Login</a>
            </div>
        </div>
    </div>
</div>

<script>
// Check for error in hash (e.g., from Supabase expired token)
// Example URL: #error=access_denied&error_code=otp_expired&error_description=Email+link+is+invalid+or+has+expired
window.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    if (params.get("error")) {
        const errorDesc = params.get("error_description") || "Invalid or expired link.";
        const hashError = document.getElementById('hashError');
        hashError.textContent = "❌ " + errorDesc.replace(/\+/g, ' ');
        hashError.style.display = 'block';
        document.getElementById('updatePasswordForm').style.display = 'none';
    }
});

document.getElementById('updatePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    const updateError = document.getElementById('updateError');
    const updateSuccess = document.getElementById('updateSuccess');
    
    updateError.style.display = 'none';
    updateSuccess.style.display = 'none';
    
    if (newPassword !== confirmPassword) {
        updateError.textContent = "❌ Passwords do not match";
        updateError.style.display = 'block';
        return;
    }
    
    try {
        const response = await fetch('/api/update-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ password: newPassword })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            updateError.textContent = "❌ " + (data.error || 'Failed to update password');
            updateError.style.display = 'block';
            return;
        }
        
        updateSuccess.textContent = "✅ " + data.message;
        updateSuccess.style.display = 'block';
        document.getElementById('updatePasswordForm').reset();
        
        // Redirect to login after a short delay
        setTimeout(() => {
            window.location.href = '/login';
        }, 2000);
        
    } catch (error) {
        console.error('Update error:', error);
        updateError.textContent = "❌ Server error. Please try again later.";
        updateError.style.display = 'block';
    }
});
</script>

</body>
</html>
