<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Password</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 420px;
}

.login-box {
    padding: 40px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    animation: fadeIn 0.6s ease;
}

.login-box h2 {
    text-align: center;
    color: #fff;
    margin-bottom: 30px;
    letter-spacing: 1px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group input {
    width: 100%;
    padding: 12px 15px;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 8px;
    outline: none;
    color: #fff;
    font-size: 14px;
    transition: 0.3s;
}

.input-group input::placeholder {
    color: #ddd;
}

.input-group input:focus {
    background: rgba(255,255,255,0.25);
    box-shadow: 0 0 0 2px #00d9ff;
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #00d9ff, #00b3ff);
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    color: #0f2027;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0,217,255,0.4);
}

.message {
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 15px;
    text-align: center;
    font-size: 14px;
    display: none;
}

.message.error {
    background: rgba(255, 77, 77, 0.2);
    color: #ff7777;
    border: 1px solid rgba(255, 77, 77, 0.4);
    display: block;
}

.message.success {
    background: rgba(16, 185, 129, 0.2);
    color: #10b981;
    border: 1px solid rgba(16, 185, 129, 0.4);
    display: block;
}

.toggle-link {
    text-align: center;
    margin-top: 15px;
}

.toggle-link a {
    color: #00d9ff;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
}

.toggle-link a:hover {
    text-decoration: underline;
    color: #00ffff;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div id="updateFormContainer">
            <h2>Update Password</h2>
            
            <div class="message error" id="updateError" style="display: none;"></div>
            <div class="message success" id="updateSuccess" style="display: none;"></div>
            
            <!-- Supabase auth hash error -->
            <div class="message error" id="hashError" style="display: none;"></div>
            
            <form id="updatePasswordForm">
                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
                </div>
                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="6">
                </div>
                <button type="submit">Update Password</button>
            </form>

            <div class="toggle-link">
                <a href="/login">Back to Login</a>
            </div>
        </div>
    </div>
</div>

<script>
// Check for error in hash (e.g., from Supabase expired token)
// Example URL: #error=access_denied&error_code=otp_expired&error_description=Email+link+is+invalid+or+has+expired
window.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    if (params.get("error")) {
        const errorDesc = params.get("error_description") || "Invalid or expired link.";
        const hashError = document.getElementById('hashError');
        hashError.textContent = "❌ " + errorDesc.replace(/\+/g, ' ');
        hashError.style.display = 'block';
        document.getElementById('updatePasswordForm').style.display = 'none';
    }
});

document.getElementById('updatePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    const updateError = document.getElementById('updateError');
    const updateSuccess = document.getElementById('updateSuccess');
    
    updateError.style.display = 'none';
    updateSuccess.style.display = 'none';
    
    if (newPassword !== confirmPassword) {
        updateError.textContent = "❌ Passwords do not match";
        updateError.style.display = 'block';
        return;
    }
    
    try {
        const response = await fetch('/api/update-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ password: newPassword })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            updateError.textContent = "❌ " + (data.error || 'Failed to update password');
            updateError.style.display = 'block';
            return;
        }
        
        updateSuccess.textContent = "✅ " + data.message;
        updateSuccess.style.display = 'block';
        document.getElementById('updatePasswordForm').reset();
        
        // Redirect to login after a short delay
        setTimeout(() => {
            window.location.href = '/login';
        }, 2000);
        
    } catch (error) {
        console.error('Update error:', error);
        updateError.textContent = "❌ Server error. Please try again later.";
        updateError.style.display = 'block';
    }
});
</script>

</body>
</html>
