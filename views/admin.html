<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
}

body {
    /* Using the exact same light gradient as contact page body, placing the dashboard in a dark wrapper, OR we can make the body dark. Let's make the body match the contact page's dark wrapper. */
    background: #020617;
    color: #cbd5e1;
    min-height: 100vh;
}

/* ===== CUSTOM SCROLLBAR ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #a855f7; }

/* ===== HEADER ===== */
header {
    background: #111827;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    position: relative;
    z-index: 10;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.profile {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid #a855f7;
    object-fit: cover;
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
}

.header-left h2 {
    color: #f8fafc;
    font-size: 22px;
    font-weight: 600;
}

.logout-btn {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
    display: inline-block;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
}

.logout-btn:hover {
    box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
    transform: translateY(-2px);
}

/* ===== DASHBOARD ===== */
.dashboard {
    padding: 40px;
    max-width: 1400px;
    margin: 0 auto;
}

/* ===== INFO CARDS ===== */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
    margin-bottom: 35px;
}

.card {
    background: #111827;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #a855f7, #7c3aed);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(168, 85, 247, 0.3);
}

.card:hover::before {
    opacity: 1;
}

.card h3 {
    font-size: 14px;
    color: #94a3b8;
    font-weight: 500;
}

.card p {
    font-size: 32px;
    font-weight: 700;
    margin-top: 10px;
    color: #f8fafc;
}

/* ===== ACTION BAR ===== */
.action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 25px;
}

.search-box input {
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #f8fafc;
    outline: none;
    width: 300px;
    font-size: 14px;
    transition: all 0.3s ease;
    color-scheme: dark;
}

.search-box input::placeholder {
    color: #64748b;
}

.search-box input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
}

.delete-all {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
    font-size: 14px;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
}

.delete-all:hover {
    box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
    transform: translateY(-2px);
}

/* ===== TABLE ===== */
.table-box {
    background: #111827;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1000px;
}

thead {
    background: #1e293b;
}

th {
    padding: 16px 20px;
    text-align: left;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #94a3b8;
    font-weight: 600;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

td {
    padding: 18px 20px;
    font-size: 14px;
    color: #cbd5e1;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    vertical-align: middle;
}

td:last-child {
    white-space: nowrap;
}

tbody tr {
    transition: all 0.2s ease;
}

tbody tr:hover {
    background: rgba(255, 255, 255, 0.03);
}

tbody tr:last-child td {
    border-bottom: none;
}

input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #a855f7;
    cursor: pointer;
}

.no-data {
    text-align: center;
    padding: 40px;
    color: #64748b;
    font-size: 15px;
    display: none;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    header {
        padding: 15px 20px;
    }
    .profile {
        width: 45px;
        height: 45px;
    }
    .header-left h2 {
        font-size: 18px;
    }
    .dashboard {
        padding: 20px;
    }
    .cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }
    .card p {
        font-size: 24px;
    }
    .search-box input {
        width: 100%;
    }
    .action-bar {
        flex-direction: column;
        align-items: stretch;
    }
}

</style>
</head>

<body>

<header>
    <div class="header-left">
        <img src="https://res.cloudinary.com/djgizjh2y/image/upload/v1787329287/rahul_Image3_uadylf.jpg" class="profile">
        <h2>Welcome, Rahul</h2>
    </div>
    <a href="/logout" class="logout-btn">Logout</a>
</header>

<section class="dashboard">

    <!-- INFO CARDS -->
    <div class="cards">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h3>Total Contacts</h3>
                    <p id="totalCount">0</p>
                </div>
                <div style="background: rgba(168, 85, 247, 0.1); padding: 12px; border-radius: 12px; color: #a855f7;">
                    <i class="fa-solid fa-users fa-lg"></i>
                </div>
            </div>
        </div>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h3>Unread Messages</h3>
                    <p id="unreadCount">0</p>
                </div>
                <div style="background: rgba(59, 130, 246, 0.1); padding: 12px; border-radius: 12px; color: #3b82f6;">
                    <i class="fa-solid fa-envelope fa-lg"></i>
                </div>
            </div>
        </div>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h3 id="todayLabel">Today's Emails</h3>
                    <p id="todayCount">0</p>
                </div>
                <div style="background: rgba(16, 185, 129, 0.1); padding: 12px; border-radius: 12px; color: #10b981;">
                    <i class="fa-solid fa-calendar-day fa-lg"></i>
                </div>
            </div>
        </div>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h3>Server Status</h3>
                    <p style="color: #10b981;">Online</p>
                </div>
                <div style="background: rgba(16, 185, 129, 0.1); padding: 12px; border-radius: 12px; color: #10b981;">
                    <i class="fa-solid fa-server fa-lg"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- ACTION BAR -->
    <div class="action-bar">
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name...">
            </div>
            <div class="search-box">
                <input type="date" id="dateInput" placeholder="Filter by date..." title="Filter by date" style="width: auto; min-width: 150px;">
            </div>
        </div>
        <button class="delete-all" onclick="deleteSelected()">Delete Selected</button>
    </div>

    <!-- TABLE -->
    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>Select</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Message</th>
                    <th>IP</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="contactTable"></tbody>
        </table>
        <div id="noData" class="no-data">No contacts found</div>
    </div>

</section>

<script>
let contacts = [];

const table = document.getElementById("contactTable");
const totalCount = document.getElementById("totalCount");
const noData = document.getElementById("noData");
const unreadCount = document.getElementById("unreadCount");
const todayCount = document.getElementById("todayCount");

/* =========================
   RENDER TABLE
========================= */
function renderTable(data, forcedDate = null) {
  table.innerHTML = "";

  if (data.length === 0) {
    noData.style.display = "block";
    totalCount.textContent = 0;
    updateCounts(data, forcedDate);
    return;
  }

  noData.style.display = "none";

  data.forEach(c => {
    let displayDate = c.date;
    if (c.date && c.date.includes('-')) {
        const [y, m, d] = c.date.split('-');
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        displayDate = `${d} ${monthNames[parseInt(m, 10) - 1]} ${y}`;
    }

    table.innerHTML += `
      <tr>
        <td><input type="checkbox" class="selectBox" value="${c.id}"></td>
        <td>${c.id}</td>
        <td>${c.name}</td>
        <td>${c.phone}</td>
        <td>${c.email}</td>
        <td>${c.msg}</td>
        <td>${c.ip}</td>
        <td>${displayDate}</td>
      </tr>
    `;
  });

  totalCount.textContent = data.length;
  updateCounts(data, forcedDate);
}

/* =========================
   UPDATE COUNTS
========================= */
function updateCounts(data, forcedDate = null) {
  const dateInput = typeof forcedDate === 'string' ? forcedDate : document.getElementById("dateInput").value;
  
  // Get local date string for today (YYYY-MM-DD)
  const todayObj = new Date();
  const tYear = todayObj.getFullYear();
  const tMonth = String(todayObj.getMonth() + 1).padStart(2, '0');
  const tDay = String(todayObj.getDate()).padStart(2, '0');
  const today = `${tYear}-${tMonth}-${tDay}`;
  
  // Get local date string for yesterday (YYYY-MM-DD)
  const yesterdayObj = new Date();
  yesterdayObj.setDate(yesterdayObj.getDate() - 1);
  const yYear = yesterdayObj.getFullYear();
  const yMonth = String(yesterdayObj.getMonth() + 1).padStart(2, '0');
  const yDay = String(yesterdayObj.getDate()).padStart(2, '0');
  const yesterday = `${yYear}-${yMonth}-${yDay}`;
  
  const targetDate = dateInput || today;

  unreadCount.textContent = 0; // temporarily disabled
  
  // Update count
  todayCount.textContent = data.filter(c => c.date === targetDate).length;
  
  // Update label
  const todayLabel = document.getElementById("todayLabel");
  if (todayLabel) {
    if (targetDate === today) {
      todayLabel.textContent = "Today's Emails";
    } else if (targetDate === yesterday) {
      todayLabel.textContent = "Yesterday's Emails";
    } else {
      const [y, m, d] = targetDate.split('-');
      const formattedDate = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      todayLabel.textContent = formattedDate + " Emails";
    }
  }
}

/* =========================
   LOAD CONTACTS
========================= */
async function loadContacts() {
  await fetchFilteredContacts();
}

/* =========================
   SEARCH & FILTER (BACKEND)
========================= */
async function fetchFilteredContacts(forceDate = null) {
  const search = document.getElementById("searchInput").value.trim();
  const date = typeof forceDate === 'string' ? forceDate : document.getElementById("dateInput").value;

  let url = '/api/contacts?';
  const params = new URLSearchParams();
  if (search) params.append('search', search);
  if (date) params.append('date', date);

  try {
    const res = await fetch(url + params.toString());
    const data = await res.json();
    renderTable(data, date);
  } catch (err) {
    console.error("Filter error", err);
  }
}

document.getElementById("searchInput").addEventListener("input", () => fetchFilteredContacts());
flatpickr("#dateInput", {
    dateFormat: "Y-m-d",
    onChange: function(selectedDates, dateStr, instance) {
        document.getElementById("dateInput").value = dateStr;
        fetchFilteredContacts(dateStr);
    }
});

/* =========================
   DELETE SELECTED
========================= */
async function deleteSelected() {
  const selectedIds = [...document.querySelectorAll(".selectBox:checked")]
    .map(cb => cb.value);

  if (selectedIds.length === 0) {
    alert("Please select at least one contact");
    return;
  }

  if (!confirm("Are you sure you want to delete selected contacts?")) return;

  try {
    await fetch("/api/contacts/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: selectedIds })
    });

    loadContacts();
  } catch (err) {
    console.error("Delete error", err);
  }
}

/* =========================
   INITIAL LOAD
========================= */
loadContacts();
</script>



</body>
</html>
